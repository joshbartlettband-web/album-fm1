# Album: every push to main is tested in the simulator, built for the FM-1 (with and without Bluetooth), and its
# site (install page, emulator, manual) published to GitHub Pages. Tags v* make an attested release instead
# (release.yml).
name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow numpy
      - name: Simulator
        run: python3 base/tools/build.py album --host
      - name: Tests
        run: |
          mkdir -p out
          for t in album/tests/*.txt; do
            echo "== $t"
            album/build/host/album_host "$t" out
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: simulator-output
          path: out/

  firmware:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow numpy
      - name: JieLi Linux toolchain (pkgman.jieliapp.com)
        run: |
          mkdir -p ~/.jieli
          curl -fL --retry 3 https://pkgman.jieliapp.com/s/linux-toolchain | tar -xJ -C ~/.jieli
          TC="$(ls -d ~/.jieli/jieli-linux-toolchains-* | sort | tail -1)"
          ln -sfn "$(basename "$TC")" ~/.jieli/toolchain
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> "$GITHUB_ENV"
      - name: JieLi AC79 SDK (gitee.com, a fixed tag; Bluetooth's libraries)
        run: |
          for i in 1 2 3; do
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK
          echo "AC79_SDK=$HOME/fw-AC79_AIoT_SDK" >> "$GITHUB_ENV"
      - name: Version
        run: echo "V=0.1.${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Firmware, with Bluetooth and without
        run: |
          set -o pipefail
          build() { python3 base/tools/build.py album "$@" 2>&1 | tee -a build.log; }
          if ! build --release "$V" || ! build --release "$V" --no-ble; then
            # the build's last lines as one annotation: readable from `gh run view` and the run's summary
            msg="$(tail -n 80 build.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=FM-1 build failed::${msg}"
            exit 1
          fi
          ls -la album/build/*.fwsc
          grep -i -E "^(notes?|ram|flash|pool|app|size|\.ram_text)|KB|bytes" build.log | tail -n 30 \
            | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/^/::notice title=FM-1 build::/'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: album-${{ env.V }}
          path: album/build/*.fwsc
          if-no-files-found: error
      - uses: mymindstorm/setup-emsdk@v14
      - name: The emulator and the site
        run: |
          set -o pipefail
          if ! { python3 base/tools/build.py album --web --release "$V" && \
                 python3 base/tools/make_site.py album "album/build/album-$V.fwsc" "$V" site && \
                 python3 album/tools/more.py site; } 2>&1 | tee site.log; then
            msg="$(tail -n 60 site.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=Site build failed::${msg}"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  pages:
    needs: firmware
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
